# One-off experiment: which fetch strategies get past CDC/USDA bot protection from GitHub's servers?
name: Probe fetch strategies
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node fetch/experiments/probe.mjs
