# Once a week, force a fresh AI summary, then hand off to the normal fetch-and-deploy job
# so the new summary is published. Can also be started by hand.
name: Weekly news summary

on:
  schedule:
    - cron: "45 5 * * 1" # Mondays 05:45 UTC (about 1:45 AM US Eastern)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Fetch fresh inputs
        run: npm run fetch
      - name: Generate the summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run summarize -- --force
      - name: Commit data
        run: |
          git config user.name "food-safety-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "data: weekly summary $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish (start the fetch-and-deploy job)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch-and-deploy.yml --ref main
